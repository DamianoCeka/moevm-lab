[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "moevm-lab"
version = "0.3.0"
description = "Research simulator for expert-aware memory virtualization in sparse Mixture-of-Experts inference."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Damiano Ceka" }
]
keywords = ["mixture-of-experts", "inference", "offloading", "prefetch", "gpu", "nvme"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
real-traces = [
  "accelerate==1.14.0",
  "huggingface-hub==1.27.0",
  "safetensors==0.8.0",
  "transformers==5.14.1",
]

[project.urls]
Homepage = "https://github.com/DamianoCeka/moevm-lab"
Repository = "https://github.com/DamianoCeka/moevm-lab"
Issues = "https://github.com/DamianoCeka/moevm-lab/issues"
Changelog = "https://github.com/DamianoCeka/moevm-lab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/DamianoCeka/moevm-lab/tree/main/docs"

[project.scripts]
moevm = "moevm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moevm = ["py.typed", "configs/*.toml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# CLI-facing validation deliberately normalizes malformed user input to ValueError.
ignore = ["TRY004"]
