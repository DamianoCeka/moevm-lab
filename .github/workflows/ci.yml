name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Static checks
        run: |
          python -m pip install ruff==0.16.2
          ruff check src tests scripts
          ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reference simulation
        run: python -m moevm compare --config configs/toy.toml --tokens 32 --no-write

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bootstrap and Windows smoke test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build tooling
        run: python -m pip install build==1.5.0 twine==7.0.0
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv /tmp/moevm-wheel
          /tmp/moevm-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/moevm-wheel/bin/python -m moevm doctor
          /tmp/moevm-wheel/bin/python -m moevm compare --tokens 4 --no-write
      - name: Test installed sdist outside the checkout
        run: |
          python -m venv /tmp/moevm-sdist
          /tmp/moevm-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/moevm-sdist/bin/python -m moevm doctor
