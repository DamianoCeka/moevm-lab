<text x="695.3" y="250.0" class="value mono" text-anchor="end">2.750s</text>
<text x="848.9" y="250.0" class="value mono" text-anchor="start">3.502s</text>
<text x="1062.0" y="251.0" class="saving mono" text-anchor="middle">21.5%</text>
