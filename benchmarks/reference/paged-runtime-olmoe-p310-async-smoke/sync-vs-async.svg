<text x="836.5" y="346.0" class="value mono" text-anchor="start">3.431s</text>
<text x="1062.0" y="347.0" class="saving mono" text-anchor="middle">20.8%</text>
<rect x="744" y="360.0" width="365" height="34" rx="17" fill="#E6F4FA"/>
<text x="926.0" y="382.0" class="callout mono" text-anchor="middle">Median: 21.5% less time · sync/async 1.27×</text>
<text x="82.0" y="459.0" class="panel-title" text-anchor="start">Retained dynamic expert cache</text>
<text x="92.0" y="523.0" class="body mono" text-anchor="start">R1</text>
<line x1="435.0" y1="518.0" x2="523.0" y2="518.0" stroke="#7C8798" stroke-width="2"/>
