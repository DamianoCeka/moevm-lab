<text x="425.0" y="570.0" class="value mono" text-anchor="end">1.205s</text>
<text x="530.9" y="570.0" class="value mono" text-anchor="start">1.685s</text>
<text x="1062.0" y="571.0" class="saving mono" text-anchor="middle">28.5%</text>
<text x="92.0" y="619.0" class="body mono" text-anchor="start">R3</text>
<line x1="436.7" y1="614.0" x2="519.5" y2="614.0" stroke="#7C8798" stroke-width="2"/>
<circle cx="436.7" cy="614.0" r="7" fill="#0072B2" stroke="#004B76"/>
<rect x="513.5" y="608.0" width="12" height="12" fill="#5B6472" stroke="#374151"/>
<text x="425.7" y="618.0" class="value mono" text-anchor="end">1.210s</text>
<text x="530.5" y="618.0" class="value mono" text-anchor="start">1.683s</text>
<text x="1062.0" y="619.0" class="saving mono" text-anchor="middle">28.1%</text>
<rect x="744" y="632.0" width="365" height="34" rx="17" fill="#E6F4FA"/>
<text x="926.0" y="654.0" class="callout mono" text-anchor="middle">Median: 28.5% less time · sync/async 1.40×</text>
<rect x="62" y="735" width="1076" height="99" rx="10" fill="#F3F4F6"/>
<text x="82.0" y="764.0" class="body" text-anchor="start">Same validated work in both modes: token IDs, logical hit/miss/eviction counts, transfer bytes and peak VRAM.</text>
<text x="82.0" y="791.0" class="small" text-anchor="start">n=3 pairs · one workload · two tokens. “Cold” means empty GPU expert cache, not cold SSD or OS cache.</text>
<text x="82.0" y="816.0" class="small mono" text-anchor="start">This smoke does not prove physical NVMe/CUDA interval overlap or general production speedup. Commit 91dece7.</text>
</svg>
