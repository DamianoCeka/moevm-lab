<text x="575.0" y="704.0" class="small mono" text-anchor="middle">2</text>
<line x1="750.0" y1="199" x2="750.0" y2="633" stroke="#E5E7EB" stroke-width="1"/>
<text x="750.0" y="704.0" class="small mono" text-anchor="middle">3</text>
<line x1="925.0" y1="199" x2="925.0" y2="633" stroke="#E5E7EB" stroke-width="1"/>
